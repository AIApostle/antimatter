<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.18" />
    </linearGradient>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background plate matching Antimatter brand styling -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#090d16" stroke="#00e5ff" stroke-opacity="0.55" stroke-width="2" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />

  <!-- Signature Antimatter ^ Caret Glyph with Electric Cyan Glow -->
  <path
    d="M18 42 L32 20 L46 42"
    fill="none"
    stroke="#00e5ff"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#cyanGlow)"
  />
</svg>